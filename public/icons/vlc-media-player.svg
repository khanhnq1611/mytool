<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="cone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff8800"/>
      <stop offset="100%" style="stop-color:#ee6600"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="256" height="256" rx="40" ry="40" fill="#2c2c2c"/>
  <!-- VLC cone body -->
  <polygon points="128,28 188,195 68,195" fill="url(#cone)" stroke="#cc5500" stroke-width="2"/>
  <!-- White stripe on cone -->
  <polygon points="128,48 172,186 84,186" fill="none" stroke="#ffffff" stroke-width="10" opacity="0.5"/>
  <!-- Cone base -->
  <ellipse cx="128" cy="195" rx="60" ry="10" fill="#ee6600" stroke="#cc5500" stroke-width="1"/>
  <!-- Cone top tip -->
  <circle cx="128" cy="32" r="5" fill="#ffaa44"/>
  <!-- Play triangle subtle overlay -->
  <polygon points="118,105 118,162 162,133" fill="#ffffff" opacity="0.15"/>
</svg>
